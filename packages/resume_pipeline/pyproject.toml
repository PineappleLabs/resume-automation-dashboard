[project]
name = "resume-pipeline"
version = "0.1.0"
description = "Selects, fits, and renders a one-page LaTeX resume tailored to a job description."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "anthropic>=0.49.0",
    "pydantic>=2.0.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
resume-pipeline = "resume_pipeline.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resume_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
