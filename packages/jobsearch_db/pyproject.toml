[project]
name = "jobsearch-db"
version = "0.1.0"
description = "Shared SQLAlchemy models and Alembic migrations for the job-search platform."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobsearch_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
