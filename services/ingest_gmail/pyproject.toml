[project]
name = "jobsearch-ingest-gmail"
version = "0.1.0"
description = "Gmail inbox ingestion worker: OAuth, incremental sync, and LLM-classified lead upsert."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.140.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.0",
    "anthropic>=0.49.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ingest-gmail = "ingest_gmail.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingest_gmail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
