[project]
name = "jobsearch-api"
version = "0.1.0"
description = "FastAPI dashboard/API for the job-search automation platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.0.0",
]
# jobsearch-db (models/engine/migrations) and resume-pipeline (the Tailor facade) are not
# listed here -- installed as separate `pip install -e packages/...` steps, same convention
# as resume-pipeline already used before this package existed. See README.md.

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
